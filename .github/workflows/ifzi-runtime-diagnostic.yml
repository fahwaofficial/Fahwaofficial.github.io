name: IFZI runtime isolation test

on:
  push:
    branches: [main]
    paths:
      - "ifzi-diagnostic/**"
      - "wrangler.diagnostic.toml"
      - ".github/workflows/ifzi-runtime-diagnostic.yml"

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install
        working-directory: worker

      - name: Link installed Worker dependencies for diagnostic config
        run: ln -s "$GITHUB_WORKSPACE/worker/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Deploy temporary diagnostic Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.diagnostic.toml
        working-directory: worker

      - name: Test runtime imports and CORS
        run: |
          set -euo pipefail
          API="https://ifzi-runtime-diagnostic.fahwaiman.workers.dev"
          for attempt in $(seq 1 10); do
            code=$(curl --silent --show-error -o /tmp/diag-health.json -w "%{http_code}" "$API/health")
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          echo "Diagnostic health HTTP: $code"
          cat /tmp/diag-health.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/diag-health.json

          code=$(curl --silent --show-error -H "Origin: https://fahwaofficial.github.io" -o /tmp/diag-cors.json -w "%{http_code}" "$API/health/cors")
          echo "Diagnostic CORS HTTP: $code"
          cat /tmp/diag-cors.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/diag-cors.json

      - name: Delete temporary diagnostic Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --silent --show-error -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ifzi-runtime-diagnostic" || true
