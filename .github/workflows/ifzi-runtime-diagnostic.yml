name: IFZI runtime isolation test

on:
  push:
    branches: [main]
    paths:
      - "ifzi-diagnostic/**"
      - "wrangler.diagnostic.toml"
      - ".github/workflows/ifzi-runtime-diagnostic.yml"

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install
        working-directory: worker

      - name: Deploy temporary diagnostic Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.diagnostic.toml
        working-directory: worker

      - name: Test runtime imports and CORS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://ifzi-runtime-diagnostic.fahwaiman.workers.dev/health | tee /tmp/diag-health.json
          grep -q '"ok":true' /tmp/diag-health.json
          curl --fail --silent --show-error https://ifzi-runtime-diagnostic.fahwaiman.workers.dev/health/cors \
            -H "Origin: https://fahwaofficial.github.io" | tee /tmp/diag-cors.json
          grep -q '"ok":true' /tmp/diag-cors.json

      - name: Delete temporary diagnostic Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler delete --config ../wrangler.diagnostic.toml --force
        working-directory: worker
