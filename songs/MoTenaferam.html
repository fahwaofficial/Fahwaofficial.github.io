<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پخش‌کننده موسیقی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 42px;
            padding: 40px 35px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            background: linear-gradient(135deg, #2a2f45, #151b2b);
            margin-bottom: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: rgba(255, 255, 255, 0.1);
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-placeholder {
            font-size: 72px;
            opacity: 0.2;
            font-weight: 300;
        }

        .song-title {
            color: #f0f2fa;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .song-artist {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        /* نوار پیشرفت */
        .progress-section {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 400;
            min-width: 40px;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            position: relative;
            transition: height 0.15s ease;
        }

        .progress-bar:hover {
            height: 7px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.4);
            transition: width 0.1s linear;
            position: relative;
        }

        /* دکمه‌های کنترلی */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 22px;
        }

        .controls button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-radius: 50%;
            width: 58px;
            height: 58px;
            font-size: 26px;
            color: #f0f2fa;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .controls button:active {
            transform: scale(0.95);
        }

        .controls .play-btn {
            width: 72px;
            height: 72px;
            font-size: 34px;
            background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
            border-color: rgba(108, 92, 231, 0.4);
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.35);
        }

        .controls .play-btn:hover {
            background: linear-gradient(135deg, #7d6ff0, #6c5ce7);
            box-shadow: 0 8px 40px rgba(108, 92, 231, 0.5);
        }

        /* دکمه بازگشت */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 8px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.35);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
            letter-spacing: 0.3px;
        }

        .back-link a:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ریسپانسیو */
        @media (max-width: 500px) {
            .player-container {
                padding: 28px 20px;
                border-radius: 32px;
            }
            .controls .play-btn {
                width: 64px;
                height: 64px;
                font-size: 30px;
            }
            .controls button {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .song-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="player-container">

    <!-- کاور -->
    <div class="cover" id="coverArt">
        <span class="cover-placeholder">🎵</span>
    </div>

    <!-- اطلاعات آهنگ -->
    <div class="song-title" id="songTitle">MoTenaferam</div>
    <div class="song-artist" id="songArtist">Fahwa</div>

    <!-- نوار پیشرفت -->
    <div class="progress-section">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time" id="totalTime">0:00</span>
    </div>

    <!-- دکمه‌های کنترل -->
    <div class="controls">
        <button id="prevBtn" aria-label="قبلی">⏮</button>
        <button class="play-btn" id="playBtn" aria-label="پخش/مکث">▶</button>
        <button id="nextBtn" aria-label="بعدی">⏭</button>
    </div>

    <!-- دکمه بازگشت به لیست -->
    <div class="back-link">
        <a href="songs/MoTenaferam.html">← بازگشت به لیست پخش</a>
    </div>

</div>

<script>
    (function() {
        // --------------------- لیست آهنگ‌ها ---------------------
        // ** مسیرها رو با توجه به جای واقعی فایل‌هات تنظیم کن **
        const playlist = [{
            title: 'آهنگ اول',
            artist: 'خواننده اول',
            src: 'music/song1.mp3',        // <-- مسیر فایل صوتی
            cover: 'images/photo3.jpg'     // <-- مسیر کاور (اختیاری)
        }, {
            title: 'آهنگ دوم',
            artist: 'خواننده دوم',
            src: 'music/song2.mp3',
            cover: 'covers/cover2.jpg'
        }, {
            title: 'آهنگ سوم',
            artist: 'خواننده سوم',
            src: 'music/song3.mp3',
            cover: 'covers/cover3.jpg'
        }];
        // -------------------------------------------------------

        // المان‌ها
        const audio = new Audio();
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const songTitleEl = document.getElementById('songTitle');
        const songArtistEl = document.getElementById('songArtist');
        const coverArtEl = document.getElementById('coverArt');

        let currentIndex = 0;
        let isPlaying = false;
        let isDragging = false;

        // ------------------- توابع کمکی -------------------
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function loadSong(index) {
            const song = playlist[index];
            if (!song) return;

            audio.src = song.src;
            songTitleEl.textContent = song.title || 'بی‌نام';
            songArtistEl.textContent = song.artist || 'ناشناس';

            // کاور
            if (song.cover) {
                coverArtEl.innerHTML = `<img src="${song.cover}" alt="کاور" />`;
            } else {
                coverArtEl.innerHTML = `<span class="cover-placeholder">🎵</span>`;
            }

            // ریست زمان و پیشرفت
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '0:00';
            audio.currentTime = 0;

            // اگر در حالت پخش بود، پخش ادامه پیدا کنه
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        }

        function updatePlayButton() {
            if (audio.paused) {
                playBtn.textContent = '▶';
            } else {
                playBtn.textContent = '⏸';
            }
        }

        // پرش به آهنگ بعدی/قبلی
        function nextSong() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        // ------------------- رویدادهای پلیر -------------------
        // پخش/مکث
        playBtn.addEventListener('click', togglePlay);

        audio.addEventListener('play', () => {
            isPlaying = true;
            updatePlayButton();
        });

        audio.addEventListener('pause', () => {
            isPlaying = false;
            updatePlayButton();
        });

        audio.addEventListener('ended', () => {
            // رفتن به آهنگ بعدی
            nextSong();
        });

        // بروزرسانی نوار پیشرفت
        audio.addEventListener('timeupdate', () => {
            if (!isDragging && audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        // کلیک روی نوار پیشرفت
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / rect.width;
            const newTime = clickX * audio.duration;
            if (!isNaN(newTime) && isFinite(newTime)) {
                audio.currentTime = newTime;
                progressFill.style.width = clickX * 100 + '%';
                currentTimeEl.textContent = formatTime(newTime);
            }
        });

        // کشیدن نوار (درگ)
        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = progressBar.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / rect.width;
            const newTime = clickX * audio.duration;
            if (!isNaN(newTime) && isFinite(newTime)) {
                audio.currentTime = newTime;
                progressFill.style.width = clickX * 100 + '%';
                currentTimeEl.textContent = formatTime(newTime);
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const rect = progressBar.getBoundingClientRect();
                let clickX = (e.clientX - rect.left) / rect.width;
                clickX = Math.max(0, Math.min(1, clickX));
                const newTime = clickX * audio.duration;
                if (!isNaN(newTime) && isFinite(newTime)) {
                    audio.currentTime = newTime;
                    progressFill.style.width = clickX * 100 + '%';
                    currentTimeEl.textContent = formatTime(newTime);
                }
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                // یک بار دیگه زمان رو ست میکنیم برای دقت
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                }
            }
        });

        // دکمه‌های قبلی/بعدی
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        // کنترل با کیبورد (فاصله برای پخش/مکث)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            }
        });

        // بارگذاری اولین آهنگ
        loadSong(0);
    })();
</script>

</body>
    </html>
