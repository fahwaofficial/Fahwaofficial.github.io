<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دانلود آثار | Fahwa Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(120, 40, 200, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.03) 0%, transparent 70%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 820px;
            width: 100%;
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            padding: 45px 35px 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), 0 0 80px rgba(100, 0, 255, 0.06);
            position: relative;
            overflow: hidden;
        }

        /* Glow line top */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a855f7, #3b82f6, #a855f7, transparent);
            filter: blur(2px);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header .icon-big {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 8px;
            animation: pulse-icon 3s ease-in-out infinite;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 20%, #c084fc 50%, #60a5fa 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 300;
        }

        .header .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
            margin: 14px auto 0;
            border-radius: 4px;
        }

        /* ===== BACK BUTTON ===== */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s ease;
            margin-bottom: 20px;
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
        }

        .back-home:hover {
            color: #c084fc;
            border-color: rgba(168, 85, 247, 0.2);
            background: rgba(168, 85, 247, 0.05);
            transform: translateX(-4px);
        }

        .back-home i {
            font-size: 1rem;
        }

        /* ===== TRACK LIST ===== */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin: 10px 0 10px;
        }

        /* ===== SINGLE TRACK CARD ===== */
        .track-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 20px 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.35s ease;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
        }

        .track-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), transparent, rgba(59, 130, 246, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .track-card:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px);
            border-color: rgba(168, 85, 247, 0.12);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        /* Track number / icon */
        .track-icon {
            font-size: 1.8rem;
            width: 48px;
            text-align: center;
            flex-shrink: 0;
            color: rgba(168, 85, 247, 0.6);
        }

        /* Track info */
        .track-info {
            flex: 1;
            min-width: 140px;
        }

        .track-info .name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .track-info .artist-name {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .track-info .duration {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 3px;
        }

        /* ===== AUDIO PLAYER ===== */
        .track-player {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .track-player audio {
            width: 180px;
            height: 38px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.4);
            outline: none;
        }

        .track-player audio::-webkit-media-controls-panel {
            background: rgba(20, 20, 30, 0.9);
            border-radius: 30px;
        }

        .track-player audio::-webkit-media-controls-play-button {
            background: #a855f7;
            border-radius: 50%;
            color: #fff;
        }

        /* ===== DOWNLOAD BUTTON ===== */
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(59, 130, 246, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.15);
            color: #c084fc;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border-color: transparent;
            color: #fff;
            transform: scale(1.04);
            box-shadow: 0 4px 25px rgba(124, 58, 237, 0.3);
        }

        .btn-download i {
            font-size: 1rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .footer .hint {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        .footer .hint i {
            color: rgba(168, 85, 247, 0.3);
            margin: 0 4px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .container {
                padding: 28px 16px 30px;
                border-radius: 30px;
            }
            .header h1 {
                font-size: 1.8rem;
            }
            .track-card {
                padding: 16px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .track-icon {
                font-size: 1.4rem;
                width: 100%;
                text-align: center;
            }
            .track-info {
                text-align: center;
            }
            .track-player {
                justify-content: center;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }
            .track-player audio {
                width: 100%;
                max-width: 280px;
            }
            .btn-download {
                width: 100%;
                justify-content: center;
                padding: 12px;
            }
            .back-home {
                font-size: 0.8rem;
                padding: 6px 14px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 20px 12px 24px;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .track-card {
                padding: 14px 12px;
            }
            .track-info .name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
